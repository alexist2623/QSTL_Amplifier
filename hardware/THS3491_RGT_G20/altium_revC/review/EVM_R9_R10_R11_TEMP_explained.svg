oke="#25475d" stroke-width="3" fill="none"/><path d="M 930,706 L 950,706" stroke="#25475d" stroke-width="3" fill="none"/><path d="M 935,712 L 945,712" stroke="#25475d" stroke-width="3" fill="none"/><path d="M 1015,610 L 1041,610" stroke="#25475d" stroke-width="3" fill="none"/><text x="50" y="800" font-size="20" fill="#203147">Typical: 1.06 V at 25 °C, +3.2 mV/°C. High-impedance readout and calibration are needed.</text><text x="50" y="834" font-size="20" fill="#203147">Tj ≈25 + (VTEMP − 1.06) / 0.0032 °C. This is a measurement output, not an enable pin.</text><text x="50" y="868" font-size="20" fill="#203147">Connect a meter/ADC using jumper leads. Do not short header pins 1–2 with a jumper cap.</text></g></svg>