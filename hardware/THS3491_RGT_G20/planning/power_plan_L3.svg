hite"/><circle cx="19.24601" cy="27.490000000000002" r=".40" fill="#edf1f4"/><circle cx="19.24601" cy="27.490000000000002" r=".20" fill="#d5dee4" stroke="white" stroke-width=".045"/><circle cx="19.24601" cy="27.490000000000002" r=".08" fill="white"/><circle cx="18.34601" cy="28.39" r=".40" fill="#edf1f4"/><circle cx="18.34601" cy="28.39" r=".20" fill="#d5dee4" stroke="white" stroke-width=".045"/><circle cx="18.34601" cy="28.39" r=".08" fill="white"/><circle cx="19.24601" cy="28.39" r=".40" fill="#edf1f4"/><circle cx="19.24601" cy="28.39" r=".20" fill="#d5dee4" stroke="white" stroke-width=".045"/><circle cx="19.24601" cy="28.39" r=".08" fill="white"/><text x="30" y="17" text-anchor="middle" font-size="1.25" fill="#20364b" stroke="white" stroke-width="0.21250000000000002" paint-order="stroke">VCC  +15 V</text><text x="30" y="55" text-anchor="middle" font-size="1.25" fill="#20364b" stroke="white" stroke-width="0.21250000000000002" paint-order="stroke">VEE  −15 V</text></g><text x="735" y="165" font-size="20" fill="#20364b">VCC / VEE를 넓은 면으로 분배</text><text x="735" y="207" font-size="20" fill="#20364b">빨강: +15 V 필터 후 전원</text><text x="735" y="249" font-size="20" fill="#20364b">파랑: −15 V 필터 후 전원</text><text x="735" y="343" font-size="20" fill="#20364b">입력 측 경로</text><text x="735" y="385" font-size="20" fill="#20364b">J6 → L1 VIN_N 면 → L2</text><text x="735" y="427" font-size="20" fill="#20364b">→ L1 VEE 면의 비아 군 → L3 VEE</text><text x="735" y="521" font-size="20" fill="#20364b">소자 측 경로</text><text x="735" y="563" font-size="20" fill="#20364b">L3 → 비아 군 → C5/C6 국부 면</text><text x="735" y="605" font-size="20" fill="#20364b">→ VS+ 13·14 / VS− 7·8</text><text x="735" y="647" font-size="20" fill="#20364b">PD16은 별도 비아로 L3 VCC 연결</text><text x="735" y="741" font-size="20" fill="#20364b">층 구성</text><text x="735" y="783" font-size="20" fill="#20364b">L1: RF + 국부 전원 면 + GND</text><text x="735" y="825" font-size="20" fill="#20364b">L2: GND 기준 면</text><text x="735" y="867" font-size="20" fill="#20364b">L3: VCC / VEE 전원 면</text><text x="735" y="909" font-size="20" fill="#20364b">L4: GND / 방열</text><text x="735" y="1013" font-size="20" fill="#20364b">전원 면과 다른 net의 관통 비아는</text><text x="735" y="1051" font-size="20" fill="#20364b">L3에서 antipad로 이격</text><text x="735" y="1105" font-size="20" fill="#20364b">전체 antipad·최종 간격은 아직 미반영</text></g></svg>